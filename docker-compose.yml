services:

  postgres:
    image: postgres:16
    container_name: academicstack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: academicstack
      POSTGRES_PASSWORD: academicstack
      POSTGRES_DB: academicstack

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  qdrant:
    image: qdrant/qdrant:latest
    container_name: academicstack-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage


volumes:
  postgres_data:
  qdrant_data: